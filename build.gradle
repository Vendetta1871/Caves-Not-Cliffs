buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'

// Released jars require Forge 14.23.5.2860+ (@Mod and mcmod.info), but the FG 2.3 toolchain can
// only launch 2847, where FML rejects that requirement before the mod loads. A Gradle run that
// launches the game therefore compiles @Mod with the toolchain's own version; verifyReleaseJar
// makes sure no such class reaches a release, and mixing both in one invocation is refused.
def releaseForgeFloor = '14.23.5.2860'
def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def devLaunch = requestedTasks.any { it.endsWith('runclient') || it.endsWith('runserver') }
if (devLaunch && requestedTasks.any { task ->
        ['build', 'assemble', 'jar', 'reobfjar', 'verifyreleasejar', 'check'].any { task.endsWith(it) } }) {
    throw new GradleException('Run runClient/runServer in a separate Gradle invocation from release'
        + ' builds: dev launches compile @Mod against the 2847 dev toolchain.')
}
ext.forgeFloor = devLaunch ? '14.23.5.2847' : releaseForgeFloor

version = '2.0.4'
group = 'net.celestiald'
archivesBaseName = 'cavesnotcliffs'

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

minecraft {
    // ForgeGradle 2.3 requires the legacy `userdev` artifact. Forge 2854+ only publishes the
    // incompatible `userdev3` format, so 2847 is the newest usable compile toolchain. The shipped
    // mod still requires Forge 2860+ at runtime (declared in @Mod and mcmod.info).
    version = '1.12.2-14.23.5.2847'
    runDir = 'run'
    mappings = 'snapshot_20171003'
    // Dev runs must load the coremod (ASM transformers + Mixin bootstrap) the same way the
    // shipped jar does via its FMLCorePlugin manifest attribute.
    coreMod = 'net.celestiald.cavesnotcliffs.core.CavesNotCliffsCorePlugin'
    // Keep @Mod(version) in sync with project.version: FML resolves mod
    // dependencies against the annotation constant, not mcmod.info.
    replaceIn 'net/celestiald/cavesnotcliffs/CavesNotCliffs.java'
    replace '@VERSION@', project.version
    replace '@FORGE_FLOOR@', forgeFloor
}

configurations {
    devMixinRuntime
}

// FG 2.3 cannot rewrite JitPack's CaveBiomesAPI sources jar ("invalid entry compressed size").
// Remapped dependency sources only serve IDE navigation; the deobfuscated jars are unaffected.
tasks.matching { it.name.startsWith('deobfCompileRemapDepSources') }.all { enabled = false }

repositories {
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.spongepowered.org/maven' }
    mavenCentral()
}

dependencies {
    // ForgeGradle 2.3's equivalent of `implementation fg.deobf(...)`.
    deobfCompile "curse.maven:fluidlogged-api-485654:8445863"

    // The 1.1.2 tag build is a frozen failure on JitPack (a transient sponge repo outage broke
    // its first attempt and tag builds are not rebuilt), so 1.1.3 is the first usable tag.
    // Deobfuscated like Fluidlogged API: the JitPack jar is SRG-named, and its @Overwrite mixin
    // methods only match the MCP-named dev runtime after FG remaps them. This also puts the API
    // on the runClient/runServer classpath, so no copy belongs in run/mods. Not bundled.
    deobfCompile('com.github.Vendetta1871:CaveBiomesAPI:1.1.3') {
        transitive = false
    }

    // Compiled against (the 0.7.11 annotation processor writes the refmap), but deliberately NOT
    // bundled into the jar. At runtime in a real instance, Mixin is provided by the MixinBootstrap
    // mod (already required transitively via CaveBiomesAPI). Bundling Mixin here too would mean
    // two copies of the library fighting over the same packages.
    compile('org.spongepowered:mixin:0.7.11-SNAPSHOT') { transitive = false }

    // The Mixin runtime MixinBootstrap 1.1.0 ships. runClient/runServer use it instead of the
    // 0.7.11 build dependency, which rejects mixins production accepts (e.g. missing client-only
    // injection targets on a dedicated server, overwrites of members another mod's AT widened).
    devMixinRuntime('org.spongepowered:mixin:0.8.4') { transitive = false }

    testCompile 'junit:junit:4.13.2'
}

mixin {
    add sourceSets.main, 'mixins.cavesnotcliffs.refmap.json'
}

// The Mixin AP writes the refmap to build/tmp/compileJava but does not place it
// on the classpath in this FG 2.3 + mixingradle 0.6 setup. Copy it into the
// compiled-classes output so it is on the classpath (and gets packed into the jar).
task copyMixinRefmap(type: Copy, dependsOn: compileJava) {
    from "${buildDir}/tmp/compileJava/compileJava-refmap.json"
    into "${buildDir}/classes/java/main"
    rename { 'mixins.cavesnotcliffs.refmap.json' }
}

// The Mixin AP cannot resolve the static @Shadow field BlockCauldron.LEVEL to its SRG
// name — the refmap entry is absent after AP runs and the production jar then crashes at
// startup with "@Shadow field LEVEL was not located". Patch it in manually using the SRG
// name from mcp-srg.srg (same workaround CaveBiomesAPI uses for MixinWorld).
task patchMixinRefmap(dependsOn: copyMixinRefmap) {
    def refmapPath = "${buildDir}/classes/java/main/mixins.cavesnotcliffs.refmap.json"
    outputs.file refmapPath
    doLast {
        def refmapFile = new File(refmapPath)
        if (refmapFile.exists()) {
            def refmap = new groovy.json.JsonSlurper().parse(refmapFile)
            def mixin = 'net/celestiald/cavesnotcliffs/mixin/CauldronMixin'
            def mapped = 'Lnet/minecraft/block/BlockCauldron;field_176591_a'
            if (!refmap.mappings.containsKey(mixin)) refmap.mappings[mixin] = [:]
            refmap.mappings[mixin]['LEVEL'] = mapped
            if (refmap.data?.searge != null) {
                if (!refmap.data.searge.containsKey(mixin)) refmap.data.searge[mixin] = [:]
                refmap.data.searge[mixin]['LEVEL'] = mapped
            }
            refmapFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(refmap))
        }
    }
}
classes.dependsOn patchMixinRefmap

jar {
    manifest {
        attributes(
            'Implementation-Title': 'Caves Not Cliffs',
            'Implementation-Version': project.version,
            'FMLCorePlugin': 'net.celestiald.cavesnotcliffs.core.CavesNotCliffsCorePlugin',
            'FMLCorePluginContainsFMLMod': 'true',
            // Without this a shipped JAR loads purely as a coremod: the @Mod and the mod's
            // resource pack (incl. the overridden minecraft:cauldron blockstate) would not load.
            'ForceLoadAsMod': 'true'
        )
    }
    // The patched refmap from the classes output and the mixin plugin's own refmap
    // contribution would land in the jar twice; keep the first (patched) copy.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ForgeGradle's reobf task converts development/MCP member names to the SRG names expected by a
// production Forge runtime. Make that task an explicit part of every release verification.
reobf {
    jar {
        mappingType = 'SEARGE'
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// These are Minecraft fields used by the current source tree which have MCP/development names.
// Finding one on a net.minecraft owner in the distributable proves that reobfuscation was skipped
// or incomplete (Material.ROCK was the original release-blocking example).
def forbiddenMcpFields = [
    'ADOBE', 'AIR', 'ARMOR_CLEANED', 'BANNER_CLEANED', 'BEDROCK',
    'BUCKET', 'BUILDING_BLOCKS', 'CAULDRON', 'CAULDRON_FILLED', 'CAULDRON_USED',
    'CLAY', 'FERN', 'GLASS', 'GLASS_BOTTLE', 'GRASS', 'IRON',
    'FLOWING_WATER', 'ITEM_BOTTLE_EMPTY', 'ITEM_BOTTLE_FILL',
    'ITEM_BUCKET_EMPTY', 'ITEM_BUCKET_EMPTY_LAVA', 'ITEM_BUCKET_FILL',
    'ITEM_BUCKET_FILL_LAVA',
    'LAVA', 'LAVA_BUCKET', 'MAX_HEALTH', 'METAL', 'MOVEMENT_SPEED',
    'PLANT', 'POTIONITEM', 'PURPLE_SHULKER_BOX', 'ROCK', 'STONE', 'VINE', 'WATER',
    'WATER_BUCKET'
] as Set

task verifyReleaseJar(dependsOn: reobfJar) {
    group = 'verification'
    description = 'Checks that the production jar is reobfuscated and contains valid release metadata.'
    inputs.file { jar.archivePath }

    doLast {
        File releaseJar = jar.archivePath
        if (!releaseJar.isFile()) {
            throw new GradleException("Production jar was not created: ${releaseJar}")
        }

        def zip = new java.util.zip.ZipFile(releaseJar)
        try {
            def readText = { String entryName ->
                def entry = zip.getEntry(entryName)
                if (entry == null) {
                    throw new GradleException("Production jar is missing ${entryName}")
                }
                def stream = zip.getInputStream(entry)
                try {
                    return stream.getText('UTF-8')
                } finally {
                    stream.close()
                }
            }

            def manifestText = readText('META-INF/MANIFEST.MF')
            if (!manifestText.contains('Implementation-Version: ' + project.version)) {
                throw new GradleException('Production manifest does not contain the release version')
            }
            def manifestStream = zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF'))
            def manifest
            try {
                manifest = new java.util.jar.Manifest(manifestStream)
            } finally {
                manifestStream.close()
            }
            if (manifest.mainAttributes.getValue('FMLCorePlugin') !=
                    'net.celestiald.cavesnotcliffs.core.CavesNotCliffsCorePlugin') {
                throw new GradleException('Production manifest does not declare the piston core plugin')
            }
            if (manifest.mainAttributes.getValue('FMLCorePluginContainsFMLMod') != 'true') {
                throw new GradleException('Production manifest does not retain the regular Forge mod container')
            }
            if (zip.getEntry('net/celestiald/cavesnotcliffs/core/HoneyPistonTransformer.class') == null) {
                throw new GradleException('Production jar is missing the honey piston transformer')
            }
            if (zip.getEntry('net/celestiald/cavesnotcliffs/core/DeadBushSupportTransformer.class') == null) {
                throw new GradleException('Production jar is missing the dead bush support transformer')
            }
            if (zip.getEntry('net/celestiald/cavesnotcliffs/core/SugarCaneSupportTransformer.class') == null) {
                throw new GradleException('Production jar is missing the sugar cane support transformer')
            }
            if (zip.getEntry('net/celestiald/cavesnotcliffs/core/LilyPadSupportTransformer.class') == null) {
                throw new GradleException('Production jar is missing the lily pad support transformer')
            }
            if (zip.getEntry('net/celestiald/cavesnotcliffs/core/MushroomSupportTransformer.class') == null) {
                throw new GradleException('Production jar is missing the mushroom support transformer')
            }
            if (zip.getEntry('net/celestiald/cavesnotcliffs/core/DoublePlantSupportTransformer.class') == null) {
                throw new GradleException('Production jar is missing the double plant support transformer')
            }
            if (zip.getEntry('net/celestiald/cavesnotcliffs/core/TallGrassSupportTransformer.class') == null) {
                throw new GradleException('Production jar is missing the tall grass support transformer')
            }
            if (zip.getEntry('net/celestiald/cavesnotcliffs/core/SchemaOnePopulationTransformer.class') == null) {
                throw new GradleException('Production jar is missing the schema-one population transformer')
            }
            if (zip.getEntry('mixins.cavesnotcliffs.json') == null) {
                throw new GradleException('Production jar is missing the mixin configuration')
            }
            if (zip.getEntry('mixins.cavesnotcliffs.refmap.json') == null) {
                throw new GradleException('Production jar is missing the mixin refmap (reobf did not remap the mixin)')
            }
            def refmapJson = new groovy.json.JsonSlurper()
                .parseText(readText('mixins.cavesnotcliffs.refmap.json'))
            def cauldronMappings = refmapJson.data?.searge?.'net/celestiald/cavesnotcliffs/mixin/CauldronMixin'
            if (cauldronMappings == null || cauldronMappings['LEVEL'] !=
                    'Lnet/minecraft/block/BlockCauldron;field_176591_a') {
                throw new GradleException('Production refmap is missing the CauldronMixin LEVEL field mapping')
            }
            if (zip.getEntry('net/celestiald/cavesnotcliffs/mixin/CauldronMixin.class') == null) {
                throw new GradleException('Production jar is missing the cauldron mixin')
            }
            def lightningMappings = refmapJson.data?.searge?.'net/celestiald/cavesnotcliffs/mixin/LightningBoltMixin'
            if (lightningMappings == null || !lightningMappings.values().contains(
                    'Lnet/minecraft/entity/effect/EntityLightningBolt;func_70012_b(DDDFF)V')) {
                throw new GradleException('Production refmap is missing the LightningBoltMixin setLocationAndAngles mapping')
            }
            def modEntry = zip.getEntry('net/celestiald/cavesnotcliffs/CavesNotCliffs.class')
            def modStream = zip.getInputStream(modEntry)
            try {
                if (!new String(modStream.bytes, 'ISO-8859-1').contains(
                        "required-after:forge@[${releaseForgeFloor},)")) {
                    throw new GradleException("@Mod does not require Forge ${releaseForgeFloor}"
                        + ' (was the jar built by a runClient/runServer invocation?)')
                }
            } finally {
                modStream.close()
            }
            if (zip.getEntry('assets/minecraft/blockstates/cauldron.json') == null) {
                throw new GradleException('Production jar is missing the vanilla cauldron blockstate override')
            }
            if (manifest.mainAttributes.getValue('ForceLoadAsMod') != 'true') {
                throw new GradleException('Production manifest does not force the coremod jar to also load as a mod')
            }

            def metadata = new groovy.json.JsonSlurper().parseText(readText('mcmod.info'))
            if (!(metadata instanceof List) || metadata.isEmpty() || metadata[0].version != project.version.toString()) {
                throw new GradleException("mcmod.info does not contain release version ${project.version}")
            }
            if (!metadata[0].dependencies.contains("required-after:forge@[${releaseForgeFloor},)".toString())) {
                throw new GradleException("mcmod.info does not require Forge ${releaseForgeFloor}")
            }
            if (!metadata[0].dependencies.any { it.startsWith('required-after:cavebiomesapi@') }) {
                throw new GradleException('mcmod.info does not declare CaveBiomesAPI as a required runtime mod')
            }

            if (zip.getEntry('org/spongepowered/asm/launch/MixinBootstrap.class') != null) {
                throw new GradleException('A Mixin runtime was accidentally bundled into the mod jar')
            }
            if (zip.getEntry('net/celestiald/cavebiomes/api/WorldHeightAPI.class') != null) {
                throw new GradleException('The CaveBiomesAPI classes were bundled into the mod jar')
            }

            def badReferences = []
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (!entry.name.endsWith('.class')) {
                    continue
                }
                def stream = zip.getInputStream(entry)
                try {
                    byte[] classBytes = stream.bytes
                    if (new String(classBytes, 'ISO-8859-1')
                            .contains('io/github/opencubicchunks/')) {
                        badReferences << "${entry.name}: static CubicChunks linkage"
                    }
                    new org.objectweb.asm.ClassReader(classBytes).accept(
                        new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM5) {
                            @Override
                            org.objectweb.asm.MethodVisitor visitMethod(int access, String name,
                                    String descriptor, String signature, String[] exceptions) {
                                return new org.objectweb.asm.MethodVisitor(org.objectweb.asm.Opcodes.ASM5) {
                                    @Override
                                    void visitFieldInsn(int opcode, String owner, String fieldName,
                                            String fieldDescriptor) {
                                        if (owner.startsWith('net/minecraft/') && forbiddenMcpFields.contains(fieldName)) {
                                            badReferences << "${entry.name}: ${owner}.${fieldName}"
                                        }
                                    }

                                    @Override
                                    void visitMethodInsn(int opcode, String owner, String methodName,
                                            String methodDescriptor, boolean isInterface) {
                                        // SoundEvent#getSoundName is client-only in 1.12.2. The
                                        // development merged jar contains it, but dedicated servers
                                        // strip it and fail with NoSuchMethodError at mod loading.
                                        if (owner == 'net/minecraft/util/SoundEvent' &&
                                                (methodName == 'getSoundName' || methodName == 'func_187503_a')) {
                                            badReferences << "${entry.name}: ${owner}.${methodName}${methodDescriptor}"
                                        }
                                    }
                                }
                            }
                        },
                        org.objectweb.asm.ClassReader.SKIP_DEBUG | org.objectweb.asm.ClassReader.SKIP_FRAMES
                    )
                } finally {
                    stream.close()
                }
            }
            if (!badReferences.isEmpty()) {
                throw new GradleException('Production jar contains unsafe Minecraft member references:\n' +
                    badReferences.unique().sort().join('\n'))
            }
        } finally {
            zip.close()
        }
    }
}

check.dependsOn verifyReleaseJar

runClient {
    args '--username', 'Dev', '--uuid', '00000000-0000-0000-0000-000000000000', '--accessToken', '0'
}

runClient.outputs.upToDateWhen { false }
runServer.outputs.upToDateWhen { false }

// Dev launches swap in the production Mixin runtime and leave Fluidlogged API out: its
// transformers emit newer MCP names (e.g. Block.material) that do not exist under this project's
// snapshot_20171003 mappings (Block.blockMaterial), so world generation dies with
// NoSuchFieldError. Test that optional integration in a real instance.
[runClient, runServer].each { launch ->
    launch.doFirst {
        classpath = configurations.devMixinRuntime + classpath.filter {
            !(it.name ==~ /mixin-0\.7\.11.*\.jar/) && !(it.name ==~ /fluidlogged-api-.*\.jar/)
        }
    }
}
