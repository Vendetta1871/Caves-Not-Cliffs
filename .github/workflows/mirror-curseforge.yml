name: Mirror to CurseForge

# Mirrors new Modrinth releases to the linked CurseForge project.
# Requires repository configuration:
#   variable  MODRINTH_SLUG           e.g. cavebiomesapi
#   variable  CURSEFORGE_PROJECT_ID   numeric project id from the CurseForge URL
#   secret    CURSEFORGE_TOKEN        token from authors.curseforge.com/#/settings/api-tokens
# Until those are set the run exits with a warning instead of failing.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report which versions would be uploaded"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mirror-curseforge
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror new Modrinth versions
        env:
          MODRINTH_SLUG: ${{ vars.MODRINTH_SLUG }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MIRROR_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 scripts/mirror_to_curseforge.py

      - name: Commit mirror state
        run: |
          set -e
          STATE=scripts/curseforge-mirror.json
          git diff --quiet -- "$STATE" && { echo "State unchanged."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE"
          git commit -m "Record mirrored CurseForge uploads"
          git push
